metadata:
  name: pth-modal-sam3-interactor
  namespace: cvat
  annotations:
    name: SAM 3 (Modal)
    version: "2"
    type: interactor
    spec: "[]"
    min_pos_points: "0"
    min_neg_points: "0"
    startswith_box_optional: "true"
    animated_gif: "https://raw.githubusercontent.com/cvat-ai/cvat/develop/site/content/en/images/hrnet_example.gif"
    help_message: "Segment one object with positive/negative clicks or a box. Inference runs on Modal GPU (SAM 3)."

spec:
  description: Interactive SAM 3 segmentation via Modal GPU
  runtime: "python:3.10"
  handler: main:handler
  eventTimeout: 180s
  env:
    - name: SAM3_MODAL_VISUAL_URL
      value: ""
    - name: MODAL_PROXY_KEY
      value: ""
    - name: MODAL_PROXY_SECRET
      value: ""
    - name: SAM3_TIMEOUT_SEC
      value: "170"

  build:
    image: cvat.pth.modal.sam3.interactor
    baseImage: ubuntu:22.04
    directives:
      preCopy:
        - kind: ENV
          value: DEBIAN_FRONTEND=noninteractive
        - kind: WORKDIR
          value: /opt/nuclio
        - kind: RUN
          value: apt-get update && apt-get install -y --no-install-recommends python3 python3-pip python-is-python3 && rm -rf /var/lib/apt/lists/*
        - kind: RUN
          value: pip3 install --no-cache-dir requests
        - kind: RUN
          value: "mkdir -p /opt/nuclio/whl && pip3 download msgpack -d /opt/nuclio/whl"

  triggers:
    myHttpTrigger:
      numWorkers: 2
      kind: http
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 33554432

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
