metadata:
  name: pth-modal-sam3-detector
  namespace: cvat
  annotations:
    name: SAM 3 Concept (Modal)
    version: "1"
    type: detector
    spec: |
      [
        { "id": 0, "name": "person", "type": "mask" },
        { "id": 1, "name": "bicycle", "type": "mask" },
        { "id": 2, "name": "car", "type": "mask" },
        { "id": 3, "name": "motorcycle", "type": "mask" },
        { "id": 4, "name": "bus", "type": "mask" },
        { "id": 5, "name": "truck", "type": "mask" },
        { "id": 6, "name": "building", "type": "mask" }
      ]

spec:
  description: SAM 3 concept segmentation via Modal GPU (text = label names)
  runtime: "python:3.10"
  handler: main:handler
  eventTimeout: 180s
  env:
    - name: SAM3_MODAL_TEXT_URL
      value: ""
    - name: MODAL_PROXY_KEY
      value: ""
    - name: MODAL_PROXY_SECRET
      value: ""
    - name: SAM3_TIMEOUT_SEC
      value: "170"

  build:
    image: cvat.pth.modal.sam3.detector
    baseImage: ubuntu:22.04
    directives:
      preCopy:
        - kind: ENV
          value: DEBIAN_FRONTEND=noninteractive
        - kind: WORKDIR
          value: /opt/nuclio
        - kind: RUN
          value: apt-get update && apt-get install -y --no-install-recommends python3 python3-pip python-is-python3 && rm -rf /var/lib/apt/lists/*
        - kind: RUN
          value: pip3 install --no-cache-dir requests pyyaml
        - kind: RUN
          value: "mkdir -p /opt/nuclio/whl && pip3 download msgpack -d /opt/nuclio/whl"

  triggers:
    myHttpTrigger:
      numWorkers: 1
      kind: http
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 33554432

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
